<a href="{{ url_for('affiliate_product_detail', product_id=product._id) }}"
   class="card-link">

  <div class="card">

    <div class="card-image-wrapper">
      {% if product.imageUrl %}
        <img
          src="{{ product.imageUrl }}"
          alt="{{ product.name }}"
          loading="lazy"
        >
      {% else %}
        <img
          src="https://via.placeholder.com/300x200?text=Producto"
          alt="Producto"
        >
      {% endif %}
    </div>

    <h3 class="card-title">{{ product.name }}</h3>

    {% if product.shortDescription %}
      <p class="card-description">{{ product.shortDescription }}</p>
    {% endif %}

    <div class="card-footer">
      <div class="card-footer-left">
        <span class="benefit-tag">Compra</span>
      </div>

      <button class="fav-btn" title="Guardar producto">♡</button>
    </div>

  </div>

</a>
