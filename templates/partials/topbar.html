<header class="topbar">

  <!-- ===================== -->
  <!-- TOP SECTION -->
  <!-- ===================== -->
  <div class="topbar-container">

    <!-- LOGO -->
    <div class="topbar-left">
      <a href="/home">
        <img
          src="{{ url_for('static', filename='img/daimon-logo.png') }}"
          alt="Daimon"
          class="logo"
        />
      </a>
    </div>

    <!-- SEARCH -->
    <div class="topbar-center">
      <form action="{{ url_for('search') }}" method="GET" class="search-form">
        <input
          class="search"
          type="text"
          name="q"
          placeholder="Escribe ej: cursos idiomas, clases guitarra, viajar..."
          required
        />
      </form>
    </div>

    <!-- USER MENU -->
    {% if current_user %}
    <div class="topbar-right">
      <div class="user-menu">

        <div class="user-avatar" id="userAvatar">
          <i class="fa-solid fa-user"></i>
        </div>

        <div id="userDropdown" class="dropdown">
          <div class="dropdown-header">
            <strong>{{ current_user.first_name or "Usuario" }}</strong>
            <span>{{ current_user.email }}</span>
          </div>

          <div class="dropdown-divider"></div>

          <a href="/logout" class="dropdown-item logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            Cerrar sesión
          </a>
        </div>

      </div>
    </div>
    {% endif %}

  </div>

  <!-- ===================== -->
  <!-- NAVIGATION -->
  <!-- ===================== -->
  <nav class="categories">

    <a href="/home"
       class="{% if request.path == '/home' %}active{% endif %}">
      Inicio
    </a>

    <a href="/cupones"
       class="{% if request.path == '/cupones' %}active{% endif %}">
      Cupones
    </a>

    <a href="/ejercicios"
       class="{% if request.path == '/ejercicios' %}active{% endif %}">
      Ejercicios
    </a>

    <a href="/turismo"
       class="{% if request.path == '/turismo' %}active{% endif %}">
      Turismo
    </a>

    <a href="/salud"
       class="{% if request.path == '/salud' %}active{% endif %}">
      Salud
    </a>

  </nav>

</header>
