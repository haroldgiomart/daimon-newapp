<header class="topbar">
  <div class="topbar-container">

    <div class="topbar-left">
      <img
        src="{{ url_for('static', filename='img/daimon-logo.png') }}"
        alt="Daimon"
        class="logo"
      />
    </div>

    <div class="topbar-center">
      <input
        class="search"
        placeholder="Escribe ej: comida, evento, viaje, gato..."
      />
    </div>

  </div>

  <nav class="categories">
  <a href="/home" class="{% if request.path == '/home' %}active{% endif %}">
    Inicio
  </a>

  <a href="/cupones" class="{% if request.path == '/cupones' %}active{% endif %}">
    Cupones
  </a>

  <a href="#" class="{% if request.path == '/bienestar' %}active{% endif %}">
    Bienestar
  </a>

  <a href="#" class="{% if request.path == '/compras' %}active{% endif %}">
    Compras
  </a>

  <a href="#" class="{% if request.path == '/turismo' %}active{% endif %}">
    Turismo
  </a>

  <a href="/salud" class="{% if request.path == '/salud' %}active{% endif %}">
    Salud
  </a>
</nav>
</header>
