<header class="topbar">
  <div class="topbar-container">

    <div class="topbar-left">
      <img
        src="{{ url_for('static', filename='img/daimon-logo.png') }}"
        alt="Daimon"
        class="logo"
      />
    </div>

    <!-- 🔍 BUSCADOR GLOBAL FUNCIONAL -->
    <div class="topbar-center">
      <form action="{{ url_for('search') }}" method="GET" class="search-form">
        <input
          class="search"
          type="text"
          name="q"
          placeholder="Escribe ej: comida, evento, viaje, gato..."
          required
        />
      </form>
    </div>

  </div>

  <nav class="categories">
    <a href="/home" class="{% if request.path == '/home' %}active{% endif %}">
      Inicio
    </a>

    <a href="/cupones" class="{% if request.path == '/cupones' %}active{% endif %}">
      Cupones
    </a>

    <a href="/ejercicios" class="{% if request.path == '/ejercicios' %}active{% endif %}">
      Ejercicios
    </a>

    <a href="#" class="{% if request.path == '/turismo' %}active{% endif %}">
      Turismo
    </a>

    <a href="/salud" class="{% if request.path == '/salud' %}active{% endif %}">
      Salud
    </a>
  </nav>
</header>
