<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta de Rutina</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/static/css/exercise-survey.css">

  <!-- FontAwesome (si usas iconos) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div id="exerciseSurveyModal" class="survey-modal active">

  <div class="survey-overlay"></div>

  <div class="survey-box">

    <!-- Stepper -->
    <div class="survey-steps">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <form id="exerciseSurveyForm"
          class="survey-content"
          method="POST"
          action="/exercise-survey/">

      <!-- STEP 1 -->
      <div class="step active">
        <h2>¿Cuál es tu objetivo principal?</h2>

        <label class="option">
          <input type="radio" name="goal" value="ganar_musculo" required>
          <span>Ganar músculo</span>
        </label>

        <label class="option">
          <input type="radio" name="goal" value="perder_grasa">
          <span>Perder grasa</span>
        </label>

        <label class="option">
          <input type="radio" name="goal" value="resistencia">
          <span>Resistencia</span>
        </label>

        <label class="option">
          <input type="radio" name="goal" value="tonificar">
          <span>Tonificar</span>
        </label>

        <label class="option">
          <input type="radio" name="goal" value="movilidad">
          <span>Movilidad</span>
        </label>
      </div>

      <!-- STEP 2 -->
      <div class="step">
        <h2>¿Dónde entrenas normalmente?</h2>

        <label class="option">
          <input type="radio" name="location" value="gimnasio">
          <span>Gimnasio</span>
        </label>

        <label class="option">
          <input type="radio" name="location" value="casa_sin_equipo">
          <span>Casa sin equipo</span>
        </label>

        <label class="option">
          <input type="radio" name="location" value="casa_con_mancuernas">
          <span>Casa con mancuernas</span>
        </label>
      </div>

      <!-- STEP 3 -->
      <div class="step">
        <h2>¿Cuánto tiempo puedes entrenar?</h2>

        <label class="option">
          <input type="radio" name="duration" value="30">
          <span>30 min</span>
        </label>

        <label class="option">
          <input type="radio" name="duration" value="45">
          <span>45 min</span>
        </label>

        <label class="option">
          <input type="radio" name="duration" value="60">
          <span>60 min</span>
        </label>
      </div>

      <!-- STEP 4 -->
      <div class="step">
        <h2>¿Qué zona quieres priorizar?</h2>

        <label class="option">
          <input type="radio" name="focus" value="lower">
          <span>Tren Inferior</span>
        </label>

        <label class="option">
          <input type="radio" name="focus" value="upper">
          <span>Tren Superior</span>
        </label>

        <label class="option">
          <input type="radio" name="focus" value="core">
          <span>Core/Abdomen</span>
        </label>

        <label class="option">
          <input type="radio" name="focus" value="full_body">
          <span>Full Body</span>
        </label>
      </div>

      <!-- STEP 5 -->
      <div class="step">
        <h2>¿Tienes alguna lesión?</h2>

        <label class="option">
          <input type="radio" name="injury" value="no">
          <span>Ninguna</span>
        </label>

        <label class="option">
          <input type="radio" name="injury" value="knee">
          <span>Rodilla</span>
        </label>

        <label class="option">
          <input type="radio" name="injury" value="shoulder">
          <span>Hombros</span>
        </label>

        <label class="option">
          <input type="radio" name="injury" value="back">
          <span>Espalda</span>
        </label>
      </div>

      <!-- STEP 6 -->
      <div class="step">
        <h2>¿Nivel de experiencia ejercicio?</h2>

        <label class="option">
          <input type="radio" name="level" value="bajo">
          <span>Principiante</span>
        </label>

        <label class="option">
          <input type="radio" name="level" value="medio">
          <span>Intermedio</span>
        </label>

        <label class="option">
          <input type="radio" name="level" value="alto">
          <span>Avanzado</span>
        </label>
      </div>

    </form>

    <!-- Footer -->
    <div class="survey-footer">
      <a href="/mis-rutinas" id="skipSurvey">Saltar encuesta</a>
    </div>

  </div>
</div>

<!-- JS -->
<script src="/static/js/exercise-survey.js"></script>

</body>
</html>
