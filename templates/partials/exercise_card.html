<div class="exercise-card">

  <!-- Link que cubre toda la card -->
  <a href="/exercise/{{ exercise.id }}" class="exercise-link"></a>

  <div class="exercise-image">
    <img src="{{ exercise.img_static }}" alt="{{ exercise.name }}">
  </div>

  <!-- BOTÓN FAVORITO -->
  <button
    type="button"
    class="exercise-favorite {% if exercise.id|string in favoritos %}active{% endif %}"
    data-id="{{ exercise.id }}"
    data-type="exercise"
    onclick="toggleFavorite(event, this)"
  >
    <i class="fa-solid fa-heart"></i>
  </button>

  <div class="exercise-body">

    <span class="exercise-difficulty level-{{ exercise.difficultyLevel }}">
      Nivel {{ exercise.difficultyLevel|capitalize }}
    </span>

    <div class="exercise-tags">
      <span class="tag main">{{ exercise.target }}</span>

      {% for muscle in exercise.secondaryMuscles[:3] %}
        <span class="tag">{{ muscle }}</span>
      {% endfor %}
    </div>

  </div>

</div>
