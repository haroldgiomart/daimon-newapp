<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login - Daimon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script
    crossorigin="anonymous"
    data-clerk-publishable-key="{{ clerk_publishable_key }}"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8f9fc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #clerk-container {
      width: 100%;
      max-width: 420px;
    }
  </style>
</head>

<body>

  <!-- IMPORTANTE: el div debe existir ANTES del script -->
  <div id="clerk-container"></div>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {

      await window.Clerk.load();

      const container = document.getElementById("clerk-container");

      if (!container) {
        console.error("Clerk container not found");
        return;
      }

      window.Clerk.mountSignIn(container, {
        fallbackRedirectUrl: "/home"
      });

    });
  </script>

</body>
</html>
