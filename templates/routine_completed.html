<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Rutina Completa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/routine_completed.css') }}">
</head>

<body>

<div class="completed-wrapper">

  <div class="success-icon">🎉</div>

  <h1>¡Rutina Completada!</h1>
  <p class="subtitle">
    Día {{ day_data.day_number }} finalizado con éxito 💪
  </p>

  <div class="results-card">

    <div class="result-item">
      <span class="result-value">{{ total_exercises }}</span>
      <span class="result-label">Ejercicios</span>
    </div>

    <div class="result-item">
      <span class="result-value">{{ total_sets }}</span>
      <span class="result-label">Series</span>
    </div>

    <div class="result-item">
      <span class="result-value">{{ total_reps }}</span>
      <span class="result-label">Repeticiones</span>
    </div>

    <div class="result-item">
      <span class="result-value">{{ avg_intensity }}%</span>
      <span class="result-label">Intensidad Promedio</span>
    </div>

  </div>

  <p class="motivation">
    La disciplina supera a la motivación. Sigue así 🚀
  </p>

  <a href="{{ url_for('mis_rutinas') }}" class="btn-primary">
    Volver a mis rutinas
  </a>

</div>

</body>
</html>
