<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<title>Mi Perfil - Daimon</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">

</head>

<body>

{% set survey_data = survey_data or {} %}
{% set exercise = exercise or {} %}

<div class="profile-container">

<!-- Breadcrumb -->

<div class="breadcrumb">
<a href="{{ url_for('home') }}">Inicio</a>
<span>/</span>
<span class="breadcrumb-current">Mi Perfil</span>
</div>

<h1>Mi Perfil</h1>


<!-- =========================
     PREFERENCIAS GENERALES
========================= -->

<div class="profile-section">

<h2>Preferencias generales</h2>

<form id="general-form">

<div class="profile-field">

<label>Situación actual</label>

<select name="situation">

<option value="empleado"
{{ 'selected' if survey_data.situation == 'empleado' else '' }}>
Empleado
</option>

<option value="emprendedor"
{{ 'selected' if survey_data.situation == 'emprendedor' else '' }}>
Emprendedor
</option>

<option value="estudiante"
{{ 'selected' if survey_data.situation == 'estudiante' else '' }}>
Estudiante
</option>

</select>

</div>


<div class="profile-field">

<label>Tienes hijos</label>

<select name="has_kids">

<option value="si"
{{ 'selected' if survey_data.has_kids == 'si' else '' }}>
Sí
</option>

<option value="no"
{{ 'selected' if survey_data.has_kids == 'no' else '' }}>
No
</option>

</select>

</div>


<div class="profile-field">

<label>Nivel de estrés</label>

<select name="stress_level">

<option value="Bajo"
{{ 'selected' if survey_data.stress_level == 'Bajo' else '' }}>
Bajo
</option>

<option value="Medio"
{{ 'selected' if survey_data.stress_level == 'Medio' else '' }}>
Medio
</option>

<option value="Alto"
{{ 'selected' if survey_data.stress_level == 'Alto' else '' }}>
Alto
</option>

</select>

</div>


<div class="profile-field">

<label>Tiempo libre</label>

<input
type="text"
name="free_time"
value="{{ survey_data.free_time | default([]) | join(', ') }}"
>

</div>


<div class="profile-field">

<label>Área que quieres mejorar</label>

<input
type="text"
name="improvement"
value="{{ survey_data.improvement | default([]) | join(', ') }}"
>

</div>


<button type="submit" class="profile-save">
Guardar preferencias
</button>

</form>

</div>



<!-- =========================
     PREFERENCIAS DE EJERCICIO
========================= -->

<div class="profile-section">

<h2>Preferencias de ejercicio</h2>

<form id="exercise-form">

<div class="profile-field">

<label>Objetivo</label>

<select name="goal">

<option value="perder_peso"
{{ 'selected' if exercise.goal == 'perder_peso' else '' }}>
Perder peso
</option>

<option value="ganar_musculo"
{{ 'selected' if exercise.goal == 'ganar_musculo' else '' }}>
Ganar músculo
</option>

<option value="mantener"
{{ 'selected' if exercise.goal == 'mantener' else '' }}>
Mantener
</option>

</select>

</div>


<div class="profile-field">

<label>Nivel</label>

<select name="level">

<option value="principiante"
{{ 'selected' if exercise.level == 'principiante' else '' }}>
Principiante
</option>

<option value="medio"
{{ 'selected' if exercise.level == 'medio' else '' }}>
Medio
</option>

<option value="avanzado"
{{ 'selected' if exercise.level == 'avanzado' else '' }}>
Avanzado
</option>

</select>

</div>


<div class="profile-field">

<label>Duración entrenamiento (min)</label>

<input
type="number"
name="duration"
value="{{ exercise.duration | default('') }}"
>

</div>


<div class="profile-field">

<label>Enfoque</label>

<select name="focus">

<option value="full_body"
{{ 'selected' if exercise.focus == 'full_body' else '' }}>
Full Body
</option>

<option value="upper_body"
{{ 'selected' if exercise.focus == 'upper_body' else '' }}>
Upper Body
</option>

<option value="lower_body"
{{ 'selected' if exercise.focus == 'lower_body' else '' }}>
Lower Body
</option>

</select>

</div>


<div class="profile-field">

<label>Lugar de entrenamiento</label>

<select name="location">

<option value="casa"
{{ 'selected' if exercise.location == 'casa' else '' }}>
Casa
</option>

<option value="gimnasio"
{{ 'selected' if exercise.location == 'gimnasio' else '' }}>
Gimnasio
</option>

</select>

</div>


<div class="profile-field">

<label>Tienes lesiones</label>

<select name="injury">

<option value="no"
{{ 'selected' if exercise.injury == 'no' else '' }}>
No
</option>

<option value="si"
{{ 'selected' if exercise.injury == 'si' else '' }}>
Sí
</option>

</select>

</div>


<button type="submit" class="profile-save">
Guardar preferencias de ejercicio
</button>

</form>

</div>

</div>

</body>
</html>
